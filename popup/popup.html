<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Clip Recorder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-dot" id="statusDot"></div>
      <span class="logo-title">Clip Recorder</span>
    </div>
    <span class="timer" id="timer">00:00</span>
  </div>

  <button class="record-btn" id="recordBtn">
    <span class="btn-icon" id="btnIcon">⏺</span>
    <span id="btnLabel">Record</span>
  </button>
  <div class="shortcut-hint">
    <b>Alt + S</b> starts / stops recording from any tab
  </div>

  <div class="control-row checkbox-row">
    <label for="countdown">3-2-1 countdown before recording</label>
    <input type="checkbox" id="countdown">
  </div>
  <div class="control-row checkbox-row">
    <label for="audioCaptureEnabled">Record tab audio</label>
    <input type="checkbox" id="audioCaptureEnabled">
  </div>
  <div class="control-row checkbox-row">
    <label for="autoExport">Export automatically when finished</label>
    <input type="checkbox" id="autoExport">
  </div>
  <div class="control-row checkbox-row">
    <label for="hideCursor" title="Records the page's own frames, so the real cursor is not in the video. Chrome shows a &quot;debugging this browser&quot; bar while recording; frame rate may be lower.">Hide system cursor in the video (beta)</label>
    <input type="checkbox" id="hideCursor">
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <script src="popup.js"></script>
</body>
</html>
